[package]
publish = false  # git-only for now, not published to crates.io
name = "bifrost-noise"
description = "A Noise XX handshake over an announced transport: the peer's key is proven and the session encrypted."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bifrost-core.workspace = true
bifrost-transport.workspace = true
ed25519-dalek.workspace = true
snow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
zeroize.workspace = true

[dev-dependencies]
bifrost.workspace = true
bifrost-conformance = { path = "../../bifrost-conformance" }
bifrost-quirk.workspace = true

# `hazmat` and `digest` let the test forger sign with a chosen nonce under a claimed key, which is how a
# torsion-twin signature is made; no new crate, only two features of the one already in the tree.
ed25519-dalek = { workspace = true, features = ["digest", "hazmat"] }
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
