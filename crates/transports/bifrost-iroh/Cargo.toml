[package]
publish = false  # git-only for now, not published to crates.io
name = "bifrost-iroh"
description = "bifrost over iroh: QUIC with NAT traversal and a relay fallback."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bifrost-core.workspace = true
bifrost-transport.workspace = true
futures-core.workspace = true
iroh.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures-util.workspace = true
iroh = { workspace = true, features = ["test-utils", "unstable-net-report"] }
iroh-relay = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
