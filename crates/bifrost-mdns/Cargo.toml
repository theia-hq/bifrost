[package]
publish = false  # git-only for now, not published to crates.io
name = "bifrost-mdns"
description = "Peer discovery over mDNS on the local network."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bifrost-core.workspace = true

blake3.workspace = true
data-encoding.workspace = true
futures-util.workspace = true
getrandom.workspace = true
if-addrs.workspace = true
swarm-discovery.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

# Per-ADDRESS IPv6 flags, which `if-addrs` reports for an interface and never for an address: the
# netlink constants on Linux, and the ioctl request plus the `in6_ifreq` shape on the BSDs. Already
# in this tree underneath `if-addrs` itself, so it adds an edge and not a crate.
[target.'cfg(any(target_os = "linux", target_vendor = "apple", target_os = "freebsd"))'.dependencies]
libc.workspace = true

[dev-dependencies]
# The raw listener `no_record_carries_the_key` reads the wire with. Already in this tree underneath
# `swarm-discovery`, which binds the same port the same way.
socket2 = { version = "0.6", features = ["all"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
