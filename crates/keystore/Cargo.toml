[package]
publish = false  # git-only for now, not published to crates.io
name = "keystore"
description = "Storage for a node's secret key: one key file, plain or sealed under a passphrase."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bifrost-core.workspace = true

argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false }
getrandom = "0.4"
icu_normalizer = { version = "2.1", default-features = false, features = ["compiled_data"] }
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
