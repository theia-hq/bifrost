[workspace]
resolver = "3"
members = [
    "crates/bifrost",
    "crates/bifrost-conformance",
    "crates/bifrost-core",
    "crates/bifrost-mdns",
    "crates/bifrost-transport",
    "crates/bifrost-wire",
    "crates/keystore",
    "crates/transports/bifrost-iroh",
    "crates/transports/bifrost-mem",
    "crates/transports/bifrost-noise",
    "crates/transports/bifrost-quirk",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bifrost = { path = "crates/bifrost" }
bifrost-core = { path = "crates/bifrost-core" }
bifrost-iroh = { path = "crates/transports/bifrost-iroh" }
bifrost-mdns = { path = "crates/bifrost-mdns" }
bifrost-mem = { path = "crates/transports/bifrost-mem" }
bifrost-noise = { path = "crates/transports/bifrost-noise" }
bifrost-quirk = { path = "crates/transports/bifrost-quirk" }
bifrost-transport = { path = "crates/bifrost-transport" }
bifrost-wire = { path = "crates/bifrost-wire" }

blake3 = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
ed25519-dalek = "2"
eyre = "0.6"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
if-addrs = "0.15"
iroh = "1.1"
libc = "0.2"
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
swarm-discovery = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
zeroize = "1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unused_must_use = "deny"
# Allowed back per-file, and only in the two platform reads under `bifrost-mdns/src/host/stable/` and
# the one `geteuid` call in `keystore/src/uid.rs`, so the next `unsafe` anywhere in the workspace has
# to be argued rather than merely written.
unsafe_code = "deny"
